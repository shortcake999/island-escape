<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;touch-action:none}

#audioBtn{position:fixed;z-index:20;right:10px;top:max(10px,env(safe-area-inset-top));font-size:9px;padding:6px 9px;background:rgba(8,10,10,.65);border:1px solid rgba(214,181,122,.2);border-radius:999px;color:#d9c9ae;backdrop-filter:blur(8px)}
#qualityBadge{position:fixed;z-index:11;right:10px;bottom:max(10px,env(safe-area-inset-bottom));font-size:8px;letter-spacing:.12em;color:#d9c9ae;opacity:.38;pointer-events:none}
#objective{position:fixed;z-index:11;left:50%;top:max(62px,calc(env(safe-area-inset-top) + 54px));transform:translateX(-50%);max-width:72vw;padding:6px 11px;border:1px solid rgba(214,181,122,.18);border-radius:999px;background:rgba(5,8,8,.62);backdrop-filter:blur(8px);font-size:10px;color:#ddd0b9;letter-spacing:.05em;pointer-events:none;text-align:center}

#movePad{position:fixed;z-index:12;right:14px;bottom:max(72px,calc(env(safe-area-inset-bottom) + 70px));width:116px;height:116px;pointer-events:none}

#movePad button:nth-child(1){left:0;top:37px}#movePad button:nth-child(2){left:37px;top:0}#movePad button:nth-child(3){left:37px;top:74px}#movePad button:nth-child(4){left:74px;top:37px}

.item{font-size:10px;padding:5px 7px;border:1px solid #ffffff20;background:#0009;border-radius:8px}

#look{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);z-index:9;opacity:.55;pointer-events:none}.lookx,.looky{position:absolute;background:#fff}.lookx{width:18px;height:1px;top:9px}.looky{height:18px;width:1px;left:9px}
#modal{display:none;background:#000b;z-index:30}.card{background:#151515;max-height:88vh;overflow:auto}.card h2{margin-top:0}.card p{line-height:1.7;color:#ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{margin:0;min-height:54px}.code{font-size:25px;width:150px;padding:9px;text-align:center;background:#222;color:#fff;border:1px solid #777;border-radius:9px}

#crosshair{position:fixed;z-index:10;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff8}#crosshair:before{left:8px;top:0;width:2px;height:18px}#crosshair:after{left:0;top:8px;width:18px;height:2px}#crosshair i,#crosshair b{position:absolute;left:7px;top:7px;width:4px;height:4px;border-radius:50%;background:#fff;display:block}#crosshair.active:before,#crosshair.active:after{background:#ffe0a0}#crosshair.active i,#crosshair.active b{background:#ffd18a}
#chapterAtmosphere{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:.18;background:radial-gradient(circle at 50% 45%,transparent 20%,#000 100%)}
#chapterBanner{position:fixed;z-index:30;left:50%;top:14%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#000b;border:1px solid #fff2;border-radius:14px;padding:10px 18px;text-align:center;letter-spacing:.12em;transition:.45s;white-space:nowrap}#chapterBanner.show{opacity:1;transform:translate(-50%,0)}
#interactLabel{position:fixed;z-index:11;left:50%;top:calc(50% + 30px);transform:translateX(-50%);font-size:11px;letter-spacing:.08em;color:#fff8;background:#0008;border:1px solid #fff2;border-radius:10px;padding:6px 10px;pointer-events:none;opacity:.7;transition:.2s}
#interactLabel.active{opacity:1;border-color:#d7b27b;color:#ffe2b5;box-shadow:0 0 20px #d7b27b22}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.progress{height:6px;background:#ffffff12;border-radius:5px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:#b99261;width:0}

/* ===== v12 CINEMATIC VISUAL POLISH ===== */
html,body{background:#050708}
canvas{filter:saturate(.88) contrast(1.08) brightness(.92)}
body:before{content:"";position:fixed;inset:0;z-index:9;pointer-events:none;opacity:.10;
background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 3px);
mix-blend-mode:soft-light}

radial-gradient(ellipse at 50% 18%,rgba(173,116,61,.28),transparent 28%),
radial-gradient(ellipse at 50% 80%,rgba(24,65,72,.20),transparent 42%),
linear-gradient(180deg,#0b1011 0%,#11100e 48%,#050708 100%)}
#title .box{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(24,23,20,.84),rgba(8,10,10,.72));
border:1px solid rgba(216,181,122,.42);box-shadow:0 28px 90px rgba(0,0,0,.75),inset 0 1px rgba(255,255,255,.08)}
#title .box:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 180deg,transparent,rgba(216,181,122,.09),transparent 30%);
animation:titleGlow 9s linear infinite;pointer-events:none}@keyframes titleGlow{to{transform:rotate(360deg)}}
#title h1{position:relative;text-shadow:0 4px 30px #000;font-weight:700;letter-spacing:.07em}

button{border-color:rgba(214,177,117,.25);box-shadow:0 5px 18px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.06);
transition:transform .15s,filter .15s,border-color .15s}

border-color:rgba(214,177,117,.20);box-shadow:0 10px 35px #0008}

border-color:rgba(226,190,127,.38);box-shadow:0 15px 55px #000a}
.card,.puzzleCard,#notebook{background:linear-gradient(145deg,rgba(25,24,21,.97),rgba(10,12,12,.96));
border-color:rgba(216,181,122,.32);box-shadow:0 30px 100px #000d,inset 0 1px rgba(255,255,255,.06)}

/* ===== v13 LIGHTWEIGHT QUALITY PACK ===== */
:root{
 --gold:#d6b57a;--glass:rgba(9,12,12,.72);--line:rgba(214,181,122,.22);
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans",sans-serif;letter-spacing:.015em}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#hud{filter:drop-shadow(0 8px 25px rgba(0,0,0,.25))}

#notebook{background:
 linear-gradient(135deg,rgba(31,27,22,.97),rgba(8,11,11,.98)),
 repeating-linear-gradient(0deg,transparent 0,transparent 28px,rgba(216,181,122,.035) 29px);
}
#notebook .note{position:relative;padding-left:16px}
#notebook .note:before{content:"";position:absolute;left:0;top:17px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(214,181,122,.4)}
/* cheap animated light, only opacity/transform */
#lightSweep{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden;opacity:.08}

background:linear-gradient(90deg,transparent,rgba(255,225,170,.9),transparent);
transform:rotate(18deg);animation:sweep 12s ease-in-out infinite}
@keyframes sweep{0%,65%{left:-35%;opacity:0}72%{opacity:1}90%,100%{left:120%;opacity:0}}

background-image:radial-gradient(rgba(255,255,255,.55) .5px,transparent .6px);

<body>
<div id="boot"><div class="spinner"></div><b>ISLAND ESCAPE</b><div class="small">WORLD INITIALIZING…</div></div>
<canvas id="cv"></canvas>
<div id="crosshair"><i></i><b></b></div><div id="interactLabel">タップして調べる</div><div id="chapterBanner"></div><div id="chapterAtmosphere"></div><div id="lightSweep"></div><div id="grain"></div>

<div id="title"><div class="box">
<h1>ISLAND <span>ESCAPE</span></h1>
<div class="sub">DRUM BARREL INCIDENT</div>
<p class="small">あなたは倉庫のドラム缶に閉じ込められた。<br>手がかりを集め、島から脱出せよ。</p>
<button class="main" onclick="newGame()">ゲーム開始</button>
<button class="main hide" id="resume" onclick="resumeGame()">つづきから</button>
<button class="main" onclick="showHelp()">遊び方</button>
<div class="small">自動セーブ対応・iPhone / iPad最適化</div><div class="small" style="opacity:.42;margin-top:6px">CINEMATIC LIGHT · MOBILE OPTIMIZED</div>
<div class="small" style="margin-top:12px">探索 → 調査 → アイテム使用 → 脱出</div>
</div></div>

<div id="hud">
<div class="badge"><b id="stage"></b><span id="objective"></span></div>
<button class="menu" onclick="showMenu()">☰</button><button class="notesBtn" onclick="openNotebook()">NOTE</button>
<div id="inventory"></div><div id="itemPanel"></div><div id="objective"></div><div id="qualityBadge">MOBILE · LIGHT</div><button id="audioBtn" onclick="toggleAudio()">♪ BGM ON</button><div id="notebook"></div><div id="puzzleOverlay"></div>
<div id="hint"></div>
</div>
<div id="look"><i class="lookx"></i><i class="looky"></i></div>
<div id="movePad"><button data-m="left">‹</button><button data-m="forward">↑</button><button data-m="back">↓</button><button data-m="right">›</button></div>
<div id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>

<script>
"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=0,H=0,dpr=1,view=0,downX=0,downY=0,moved=false,dragging=false;
let player={x:0,z:0,yaw:0};
let seaTime=0,finalLock=false,scenePulse=0,notes=[],puzzleDigits=[0,0,0],puzzleTarget=[2,8,5];
let audioCtx=null,lastStep=0,startedAudio=false;
let move={left:false,right:false,forward:false,back:false};
let focusObject=null,selectedItem=null;
const itemInfo={
 rope:{label:"ロープ",desc:"解いたロープ。使い道はまだない。"},
 lever:{label:"レバー",desc:"油圧ロックを解除した。"},
 pin:{label:"安全ピン",desc:"古い安全ピン。ロック機構に使える。"},
 key:{label:"荷札の情報",desc:"棚の荷札から得た順番。"},
 tool:{label:"工具",desc:"工具箱から入手した小型工具。"},
 gear:{label:"予備電源",desc:"制御盤に接続できる電源ユニット。"},
 panel:{label:"制御盤情報",desc:"制御盤の点滅順を記録した。"}
};
const objects3D=[
 {id:"tool",name:"工具箱",x:-1.3,z:.4},
 {id:"drum",name:"青いドラム缶",x:1.2,z:1.4},
 {id:"panel",name:"制御盤",x:2.6,z:.1},
 {id:"shelf",name:"棚の荷札",x:-2.8,z:1.6},
 {id:"door",name:"大扉",x:3.1,z:3.7},
 {id:"clock",name:"古い壁時計",x:-2.8,z:-1.1},
 {id:"wall",name:"壁の傷跡",x:-3.0,z:-2.6}
];

const KEY="islandEscapeV2";
let S={stage:1,rope:0,lever:0,pin:0,key:0,tool:0,gear:0,panel:0,door:0,boat:0};

const $=id=>document.getElementById(id);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener("resize",resize);





function updateObjective(){
 const o=$("objective"); if(!o)return;
 let t="探索を始める";
 if(S.stage===1)t=S.rope?"ドラム缶から脱出する":"ロープの結び目を調べる";
 if(S.stage===2)t=!S.lever?"ロックを解除する":!S.pin?"安全機構を探す":"倉庫へ進む";
 if(S.stage===3){
   if(!S.key)t="倉庫を探索して荷札の手がかりを探す";
   else if(!S.tool)t="工具箱を調べる";
   else if(!S.gear)t="予備電源の手がかりを探す";
   else if(!S.panel)t="制御盤を復旧する";
   else if(!S.door)t="大扉のロックを解除する";
   else t="海岸へ向かう";
 }
 if(S.stage===4)t=finalLock?"ボートを出航させる":"係留ロックを外してボートへ";
 o.textContent=t;o.style.borderColor=(S.stage===3&&!S.panel)?"rgba(216,181,122,.30)":"rgba(214,181,122,.18)";
}
function setAtmosphere(){
 const a=$("chapterAtmosphere");
 if(!a)return;
 if(S.stage===1)a.style.background="radial-gradient(circle at 50% 40%,#7d4d25 0%,transparent 35%,#000 100%)";
 else if(S.stage===2)a.style.background="radial-gradient(circle at 50% 45%,#34585b 0%,transparent 38%,#000 100%)";
 else if(S.stage===3)a.style.background="radial-gradient(circle at 52% 42%,#6b5740 0%,transparent 32%,#000 100%)";
 else a.style.background="radial-gradient(circle at 70% 25%,#f3bd75 0%,transparent 34%,#12313b 100%)";
}
function chapterBanner(title,sub){
 const el=$("chapterBanner");
 el.innerHTML=`<b>${title}</b><br><small>${sub}</small>`;
 el.classList.add("show");
 setTimeout(()=>el.classList.remove("show"),2600);
}
function startAudio(){
 if(startedAudio)return;
 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  startedAudio=true;
 }catch(e){}
}
function tone(freq,duration=.08,type="sine",gain=.025){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
 o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);
}
function stepSound(){
 const now=performance.now();
 if(now-lastStep<230)return;
 lastStep=now;tone(70,.045,"triangle",.018);
}
function successSound(){sfx("ok");tone(520,.09,"sine",.035);setTimeout(()=>tone(780,.14,"sine",.03),80)}
function errorSound(){sfx("bad");tone(120,.12,"sawtooth",.025)}


function closePuzzle(){
 $("puzzleOverlay").classList.remove("show");
 $("puzzleOverlay").innerHTML="";
}
function openDialPuzzle(){
 const el=$("puzzleOverlay");
 el.innerHTML=`<div class="puzzleCard">
 <h2>隠し金庫</h2>
 <p>壁の傷跡、時計、荷札の情報を組み合わせて3桁を完成させる。</p>
 <div class="dial">${[0,1,2].map(i=>`<button onclick="turnDial(${i},-1)">−</button><b id="digit${i}" style="font-size:30px;min-width:30px;text-align:center">${puzzleDigits[i]}</b><button onclick="turnDial(${i},1)">＋</button>`).join("")}</div>
 <button onclick="checkDial()">解除する</button>
 <button class="close" onclick="closePuzzle()">戻る</button>
 </div>`;
 el.classList.add("show");
}
function turnDial(i,d){
 puzzleDigits[i]=(puzzleDigits[i]+d+10)%10;
 const el=$("digit"+i);if(el)el.textContent=puzzleDigits[i];
 tone(240+puzzleDigits[i]*30,.04,"square",.015);
}
function checkDial(){
 if(puzzleDigits.join("")==="285"){
   S.hidden=1;
   addNote("隠し金庫","3桁の番号は285。金庫の中から予備電源を見つけた。");
   S.gear=1;selectedItem="gear";save();closePuzzle();update();draw();successSound();toast("隠し金庫が開いた");
 }else{
   errorSound();toast("ロックが開かない");
 }
}
function addNote(title,text){
 notes=notes.filter(n=>n.title!==title);
 notes.push({title,text});
 save();
 updateNotebook();
}
function updateNotebook(){
 const el=$("notebook"); if(!el)return;

let audioCtx=null,masterGain=null,bgmGain=null,noiseGain=null,audioOn=false,audioTimer=null;
let stageAudio=0, audioNodes=[];
function initAudio(){
 if(audioCtx)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){toast("この端末ではBGMを利用できません");return}
 audioCtx=new AC();
 masterGain=audioCtx.createGain();masterGain.gain.value=.55;masterGain.connect(audioCtx.destination);
 bgmGain=audioCtx.createGain();bgmGain.gain.value=.16;bgmGain.connect(masterGain);
 noiseGain=audioCtx.createGain();noiseGain.gain.value=.025;noiseGain.connect(masterGain);
 startStageMusic();
}
function osc(freq,dur,type="sine",gain=.04,when=0){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+when);
 g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);
 g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+when+.06);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+dur);
 o.connect(g);g.connect(bgmGain);o.start(audioCtx.currentTime+when);o.stop(audioCtx.currentTime+when+dur+.08);
}
function kick(){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type="sine";o.frequency.setValueAtTime(90,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(42,audioCtx.currentTime+.18);
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.25);
 o.connect(g);g.connect(bgmGain);o.start();o.stop(audioCtx.currentTime+.28);
}
function padChord(root){
 const ratios=[1,1.25,1.5,2];
 ratios.forEach((r,i)=>osc(root*r,2.8,"sine",.012,i*.08));
}
function startStageMusic(){
 if(!audioCtx)return;
 if(audioTimer)clearInterval(audioTimer);
 const seqs={
  1:[55,65.41,73.42,65.41],
  2:[65.41,73.42,82.41,73.42],
  3:[49,55,61.74,55],
  4:[55,65.41,73.42,98]
 };
 const seq=seqs[S.stage]||seqs[1];let i=0;
 padChord(seq[0]);
 audioTimer=setInterval(()=>{
   if(!audioOn)return;
   const root=seq[i%seq.length];
   padChord(root);
   osc(root*2,.65,"triangle",.018);
   if(S.stage>=3 && i%4===0)kick();
   if(S.stage===4 && i%2===1)osc(root*3,.35,"sine",.014);
   i++;
 },1450);
}
function stageAudioUpdate(){
 if(!audioCtx||!audioOn)return;
 if(stageAudio!==S.stage){stageAudio=S.stage;startStageMusic();}
}
function toggleAudio(){
 if(!audioCtx)initAudio();
 if(!audioCtx)return;
 audioOn=!audioOn;
 if(audioCtx.state==="suspended")audioCtx.resume();
 bgmGain.gain.setTargetAtTime(audioOn?.16:0,audioCtx.currentTime,.35);
 noiseGain.gain.setTargetAtTime(audioOn?.025:0,audioCtx.currentTime,.35);
 $("audioBtn").textContent=audioOn?"♪ BGM ON":"♪ BGM OFF";
}
function sfx(type){
 if(!audioCtx||!audioOn)return;
 const map={click:[520,.06],ok:[660,.14],bad:[130,.18],open:[330,.35],wave:[180,.4]};
 const [f,d]=map[type]||map.click;
 osc(f,d,type==="bad"?"sawtooth":"sine",type==="bad"?.035:.028);
 if(type==="ok")osc(f*1.5,.18,"sine",.02,.08);
}

function shade(hex,amount){
const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amount)),g=Math.max(0,Math.min(255,((n>>8)&255)+amount)),b=Math.max(0,Math.min(255,(n&255)+amount));
return `rgb(${r},${g},${b})`;
}
function project(x,z,y=0){
const dx=x-player.x,dz=z-player.z;
const ca=Math.cos(player.yaw),sa=Math.sin(player.yaw);
const cx=dx*ca-dz*sa,cz=dx*sa+dz*ca;
if(cz<.25)return null;
const f=Math.min(W,H)*.72;
return {x:W/2+(cx/cz)*f,y:H*.55-(y/cz)*f,z:cz};
}
function cube(x,z,w,d,h,c){
const a=project(x-w/2,z-d/2,0),b=project(x+w/2,z-d/2,0),c1=project(x+w/2,z+d/2,0),d1=project(x-w/2,z+d/2,0);
const t1=project(x-w/2,z-d/2,h),t2=project(x+w/2,z-d/2,h),t3=project(x+w/2,z+d/2,h),t4=project(x-w/2,z+d/2,h);
if(!a||!b||!c1||!d1||!t1||!t2||!t3||!t4)return;
ctx.fillStyle=shade(c,-18);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(t2.x,t2.y);ctx.lineTo(t1.x,t1.y);ctx.closePath();ctx.fill();
ctx.fillStyle=shade(c,8);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(c1.x,c1.y);ctx.lineTo(t3.x,t3.y);ctx.lineTo(t2.x,t2.y);ctx.closePath();ctx.fill();
ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(t1.x,t1.y);ctx.lineTo(t2.x,t2.y);ctx.lineTo(t3.x,t3.y);ctx.lineTo(t4.x,t4.y);ctx.closePath();ctx.fill();
}

for(const o of objects3D){

 const angle=Math.atan2(dx,dz)-player.yaw;

 if(dist<2.15 && Math.abs(a)<.42 && dist<best){best=dist;focusObject=o;}
}

label.textContent=`「${focusObject.name}」を調べる  ·  ${dist.toFixed(1)}m`;

 label.classList.remove("active");

}

 }

 /* large industrial door */
 const door=project(3.1,3.7,0);
 if(door){
   ctx.fillStyle="#090d0e";ctx.fillRect(door.x-50,door.y-125,100,125);
   ctx.strokeStyle="#81705b";ctx.lineWidth=5;ctx.strokeRect(door.x-50,door.y-125,100,125);
   for(let y=door.y-110;y<door.y;y+=23){
     ctx.fillStyle="rgba(164,146,116,.12)";ctx.fillRect(door.x-40,y,80,2);
   }
   const pulse=.42+.38*Math.sin(t*2);
   ctx.shadowBlur=16;ctx.shadowColor=`rgba(216,61,48,${pulse})`;
   circle(door.x,door.y-108,5,`rgba(216,61,48,${pulse})`);
   ctx.shadowBlur=0;
   ctx.fillStyle="#b39a72";ctx.fillRect(door.x-6,door.y-52,12,4);
 }

 /* dust motes */
 for(let i=0;i<12;i++){
   const wx=-3.7+((i*1.43)%7.4), wz=-2.7+((i*1.87)%7.8);
   const p=project(wx,wz,1.0+Math.sin(t*.7+i)*.28);
   if(p)circle(p.x,p.y,1,"rgba(233,210,172,.16)");
 }

 /* soft vignette */
 const v=ctx.createRadialGradient(W/2,H*.53,Math.min(W,H)*.18,W/2,H*.53,Math.max(W,H)*.72);
 v.addColorStop(0,"rgba(0,0,0,0)");
 v.addColorStop(.68,"rgba(0,0,0,.05)");
 v.addColorStop(1,"rgba(0,0,0,.52)");
 ctx.fillStyle=v;ctx.fillRect(0,0,W,H);

 text("WAREHOUSE 01",W/2,H*.15,10,.36);
}
function draw(){
if(!W)return;
if(S.stage===1)drawBarrel();else if(S.stage===2)drawDrum();else if(S.stage===3)draw3DWarehouse();else drawBeach();
ambient();
requestAnimationFrame(draw);
}
function drawBarrel(){
 bg("#040607","#2a211a");
 const x=W/2+Math.sin(view)*W*.045;

 /* warm light leaking through the barrel top */
 const light=ctx.createRadialGradient(x,H*.27,5,x,H*.35,Math.min(W,H)*.58);
 light.addColorStop(0,"rgba(220,164,94,.18)");light.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=light;ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#59615d";ctx.lineWidth=6;
 for(let i=0;i<9;i++){
   ctx.beginPath();ctx.ellipse(x,H*.52,Math.min(W*.47,310)+i*4,H*.61-i*6,0,0,Math.PI*2);ctx.stroke();
 }
 ctx.fillStyle="#121716";ctx.beginPath();ctx.ellipse(x,H*.52,Math.min(W*.405,278),H*.505,0,0,Math.PI*2);ctx.fill();

 /* metal rings */
 for(let i=0;i<4;i++){
   ctx.strokeStyle="rgba(173,142,99,.20)";ctx.lineWidth=3;
   ctx.beginPath();ctx.ellipse(x,H*(.30+i*.12),Math.min(W*.39,260),H*.035,0,0,Math.PI*2);ctx.stroke();
 }
 /* rope knots in foreground */
 ctx.strokeStyle="#b58e69";ctx.lineWidth=9;ctx.beginPath();
 ctx.moveTo(x-W*.14,H*.56);ctx.quadraticCurveTo(x,H*.40,x+W*.14,H*.56);ctx.stroke();
 circle(x-W*.12,H*.58,24,"#845846");circle(x+W*.12,H*.58,24,"#845846");

 /* tiny dust motes */
 for(let i=0;i<18;i++){
   const px=(i*97+performance.now()*.006)%W;
   const py=(H*.20+(i*53)%Math.floor(H*.5));
   circle(px,py,1,"rgba(220,190,145,.20)");
 }
 text("DRUM BARREL",x,H*.15,12,.55);
 text("三重結び",x,H*.22,25);
 text(S.rope?"結び目は解除済み":"結び目を調べる",x,H*.28,14,.75);
 const cx=W/2,cy=H*.53,r=Math.min(W,H)*.34;
 for(let i=0;i<5;i++){
   ctx.strokeStyle=`rgba(175,135,78,${.24-i*.025})`;ctx.lineWidth=3;
   ctx.beginPath();ctx.ellipse(cx,cy-r*.55+i*r*.28,r*(.68+i*.02),r*.08,0,0,Math.PI*2);ctx.stroke();
 }
}

function drawDrum(){
bg("#101517","#43382d");floor("#40382f");let x=W/2;
rect(x-W*.37,H*.16,W*.74,H*.59,"#3e4745");ctx.strokeStyle="#7b837f";ctx.lineWidth=4;ctx.strokeRect(x-W*.37,H*.16,W*.74,H*.59);
ctx.fillStyle="#202423";ctx.beginPath();ctx.ellipse(x,H*.17,W*.37,34,0,0,Math.PI*2);ctx.fill();
rect(x+W*.23,H*.37,18,136,S.lever?"#d2aa70":"#8a5d38");rect(x-W*.23,H*.39,14,82,S.pin?"#9d9a89":"#c7c4b2");
circle(x+W*.235,H*.37,10,S.lever?"#78a76a":"#6b4530");circle(x-W*.225,H*.39,9,S.pin?"#78a76a":"#765f46");
text("レバー",x+W*.27,H*.33,12);text("安全ピン",x-W*.23,H*.34,12);
text("倉庫の脱出口",x,H*.84,20);text(S.lever&&S.pin?"ロック解除。タップで脱出":"2つのロックを解除する",x,H*.90,13,.72);
}
function drawWarehouse(){
bg("#0c1417","#51483d");floor("#433c34");
const sway=Math.sin(performance.now()/2600)*4;
rect(W*.04,H*.11,W*.92,H*.58,"#292f2f");
rect(W*.07,H*.15,W*.86,H*.035,"#161a19");
for(let i=0;i<6;i++){
const y=H*(.22+i*.075);
rect(W*.09,y,W*.34,7,"#755638");
for(let j=0;j<4;j++){
const bx=W*(.11+j*.075);
const by=y+9;
rect(bx,by,W*.052,30,["#6f5032","#365b62","#854239","#78683b"][j]);
}
}
rect(W*.445+sway,H*.49,130,67,"#743027");
rect(W*.455+sway,H*.505,110,39,"#3a1715");
text("TOOL CASE",W*.51+sway,H*.555,11,.7);
for(let i=0;i<4;i++){circle(W*.67+i*39,H*.36,18,["#31627a","#a23b34","#a9903e","#35657a"][i]);circle(W*.67+i*39,H*.36,7,"#111b1d")}
rect(W*.78,H*.18,W*.16,H*.50,"#5e4730");
rect(W*.805,H*.235,W*.11,H*.36,"#0d1212");
line(W*.86,H*.25,W*.86,H*.59,"#b09a79",2);
circle(W*.86,H*.42,5,"#c7a56f");
text("CONTROL",W*.69,H*.30,11,.7);text("DOOR",W*.86,H*.17,16,.8);
text("棚 → 工具箱 → 青ドラム → 制御盤 → 大扉",W/2,H*.87,13,.72);
}
function drawBeach(){
seaTime+=.008;
const sky=ctx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,"#172d3a");sky.addColorStop(.55,"#345b66");sky.addColorStop(1,"#c18d62");
ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

ctx.fillStyle="#d3b083";ctx.fillRect(0,H*.61,W,H*.39);

for(let i=0;i<8;i++){
 const yy=H*(.61+i*.028);
 const off=Math.sin(seaTime*2+i)*12;
 ctx.strokeStyle=`rgba(230,240,220,${.18-i*.012})`;
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(-20+off,yy);ctx.quadraticCurveTo(W*.35+off,yy-5,W*.72+off,yy);
 ctx.quadraticCurveTo(W*.86+off,yy+4,W+20+off,yy-1);ctx.stroke();
}

const sunX=W*.78,sunY=H*.20;
const glow=ctx.createRadialGradient(sunX,sunY,8,sunX,sunY,90);
glow.addColorStop(0,"rgba(255,240,190,.85)");glow.addColorStop(1,"rgba(255,220,150,0)");
ctx.fillStyle=glow;ctx.fillRect(sunX-100,sunY-100,200,200);
circle(sunX,sunY,22,"#ffe5ad");

ctx.fillStyle="#26363a";
ctx.beginPath();ctx.moveTo(0,H*.54);ctx.lineTo(W*.13,H*.45);ctx.lineTo(W*.34,H*.53);ctx.lineTo(W*.53,H*.44);ctx.lineTo(W*.76,H*.52);ctx.lineTo(W,H*.46);ctx.lineTo(W,H*.61);ctx.lineTo(0,H*.61);ctx.closePath();ctx.fill();

const bx=W*.62,by=H*.63+Math.sin(seaTime)*3;
ctx.save();ctx.translate(bx,by);
ctx.fillStyle="#3a2118";ctx.beginPath();ctx.moveTo(-90,0);ctx.lineTo(82,0);ctx.lineTo(57,28);ctx.lineTo(-62,28);ctx.closePath();ctx.fill();
ctx.fillStyle="#7b4d2d";ctx.fillRect(-52,-12,104,12);
ctx.fillStyle="#211812";ctx.fillRect(-10,-72,20,60);
ctx.strokeStyle="#b99562";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-70);ctx.lineTo(0,-12);ctx.stroke();
ctx.fillStyle="#d9c08d";ctx.beginPath();ctx.moveTo(3,-67);ctx.lineTo(52,-42);ctx.lineTo(3,-20);ctx.closePath();ctx.fill();
ctx.restore();

ctx.strokeStyle="#6a5035";ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(W*.42,H*.63);ctx.lineTo(W*.62,H*.63);ctx.stroke();
circle(W*.42,H*.63,6,"#8c6943");

text("係留ロックを外してボートへ",W/2,H*.88,15,.85);
}

function sequence(title,desc,names,answer,done){
let p=0;
popup(`<h2>${title}</h2><p>${desc}</p><div class="grid">${names.map((n,i)=>`<button id="sq${i}">${n}</button>`).join("")}</div><div class="progress"><i id="bar"></i></div><p id="progress">0 / ${answer.length}</p>`);
names.forEach((n,i)=>$("sq"+i).onclick=()=>{
if(i!==answer[p]){p=0;$("progress").textContent="失敗 — 最初から";$("bar").style.width="0%";errorSound();toast("手順を間違えた");return}
p++;$("progress").textContent=p+" / "+answer.length;$("bar").style.width=(p/answer.length*100)+"%";
if(p===answer.length){successSound();done();close();update();draw();toast("謎を解いた")}
});
}
function interact(){
if(S.stage===1){
sequence("三重結び・ロープ解除","結び目の荷重を逃がす順番を見抜け。6手。",["A","B","C","D"],[2,3,0,1,3,2],()=>{S.rope=1;S.stage=2;selectedItem="rope";stageAudio=0;addNote("脱出開始","ロープを解いた。ドラム缶の外には別のロックがある。");save();setAtmosphere();update()});
}else if(S.stage===2){
if(!S.lever)sequence("油圧レバー","ランプの記録：黄 → 赤 → 緑。",["赤","黄","緑"],[1,0,2],()=>{S.lever=1;selectedItem="lever";addNote("ロック","レバーを操作した。もう一つの安全機構を探す。");save();update()});
else if(!S.pin)sequence("安全ピン","短く2回、最後に長く引く。",["短","長"],[0,0,1],()=>{S.pin=1;S.stage=3;player.x=0;player.z=-3.8;player.yaw=0;selectedItem="pin";stageAudio=0;addNote("倉庫","安全ピンを外すと倉庫へ出られた。");save();setAtmosphere();update()});
else {S.stage=3;save();update();draw()}
}else if(S.stage===3){
inspectWarehouseObject();
}else{
if(!S.boat)sequence("ボート・係留ロック","船体に刻まれた印：波 → 鳥 → 月。",["波","鳥","月"],[0,1,2],()=>{S.boat=1;save()});
else clearGame();
}
}
window.checkCode=()=>{if($("code").value==="285"){S.gear=1;selectedItem="gear";addNote("予備電源","青いドラム缶の暗証番号は285。中に予備電源が入っている。");save();close();update();draw();toast("予備電源を入手")}else toast("番号が違う")};

function stageMessage(title,body,next){
 popup(`<h2>${title}</h2><p>${body}</p><button onclick='close();${next||""}'>進む</button>`);
}
function clearGame(){
successSound();
popup("<h1>脱出成功</h1><p>最後の係留ロープを外した。エンジンが始動する。</p><p>朝の光の中、倉庫のあった島が少しずつ遠ざかっていく。</p><h2>— ISLAND ESCAPE —</h2><p>CHAPTER 1 · DRUM BARREL INCIDENT</p><button onclick='localStorage.removeItem(KEY);location.reload()'>最初から</button>");
}

cv.addEventListener("pointerdown",e=>{startAudio();dragging=true;moved=false;downX=e.clientX;downY=e.clientY});
cv.addEventListener("pointermove",e=>{if(!dragging)return;let dx=e.clientX-downX;if(Math.abs(dx)>5)moved=true;view+=dx*.004;player.yaw+=dx*.006;downX=e.clientX});
cv.addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;if(!moved)interact()});
cv.addEventListener("pointercancel",()=>dragging=false);
document.querySelectorAll("#movePad button").forEach(b=>{
const k=b.dataset.m;
const on=()=>move[k]=true,off=()=>move[k]=false;
b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off);
});
player.yaw=0;


resize();update();
initParticles();setAtmosphere();
setTimeout(()=>{
$("boot").classList.add("hide");
if(hasSave())$("resume").classList.remove("hide");
$("title").style.display="flex";
},850);
</script>
</body>
</html>
